
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>FORMULA MECÁNICA</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #1c1c1c;
        }

        /* PORTADA */
        .portada {
            height: 100vh;
            position: relative;
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* VIDEO DE FONDO */
        .video-fondo {
            position: absolute;
            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;
            z-index: 1;
        }

        /* CAPA OSCURA */
        .oscuro {
            position: absolute;
            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background-color: rgba(0, 0, 0, 0.45);
            z-index: 2;
        }

        /* CONTENIDO */
        .contenido {
            position: relative;
            z-index: 3;

            text-align: center;
        }

        /* TÍTULO Y GIFS */
        .titulo-con-gifs {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
        }

        /* GIFS */
        .titulo-con-gifs img {
            width: 120px;
            height: 120px;
            object-fit: contain;
        }

        /* TÍTULO */
        h1 {
            color: #ff6a00;
            font-size: 70px;
            margin: 0;

            text-shadow: 0 0 15px black;
        }

        /* ESLOGAN */
        .eslogan {
            color: white;
            font-size: 25px;
            margin-top: 20px;
            letter-spacing: 3px;

            text-shadow: 0 0 10px black;
        }
    </style>
</head>

<body>

    <div class="portada">

        <!-- VIDEO DE FONDO -->
        <video class="video-fondo" autoplay muted loop playsinline>
            <source src="motor.mp4" type="video/mp4">
        </video>

        <!-- CAPA OSCURA -->
        <div class="oscuro"></div>

        <!-- CONTENIDO -->
        <div class="contenido">

            <!-- GIFS Y TÍTULO -->
            <div class="titulo-con-gifs">

                <img src="Varoom.gif" alt="GIF">

                <h1>FORMULA MECÁNICA</h1>

                <img src="Varoom.gif" alt="GIF">

            </div>

            <!-- ESLOGAN -->
            <p class="eslogan">
                Donde la potencia cobra vida
            </p>

        </div>

    </div>

</body>
</html>
